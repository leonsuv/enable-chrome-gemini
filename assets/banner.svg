<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="100%" stop-color="#0F1420"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 70) rotate(135) scale(460 280)">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 290) rotate(-25) scale(360 180)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263044"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#glow1)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#glow2)"/>

  <!-- Left column: Icon + Title + Tagline -->
  <g transform="translate(64, 62)">
    <!-- Minimal 4-point Gemini star mark inside glass tile -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="#131926" stroke="#28354D" stroke-width="1.2"/>
    <path d="M23 10 C23.6 18.2 27.8 22.4 36 23 C27.8 23.6 23.6 27.8 23 36 C22.4 27.8 18.2 23.6 10 23 C18.2 22.4 22.4 18.2 23 10 Z" fill="url(#spark)"/>

    <!-- Pill tag -->
    <rect x="62" y="10" width="128" height="26" rx="13" fill="#131B2E" stroke="#263656" stroke-width="1"/>
    <circle cx="77" cy="23" r="3.5" fill="#60A5FA"/>
    <text x="89" y="27" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="0.02em">macOS · Chrome</text>

    <!-- Main title -->
    <text x="0" y="106" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em">enable-chrome-gemini</text>

    <!-- Subtitle -->
    <text x="0" y="142" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="400">Enable native Gemini in Chrome (Glic) on macOS — persistent across Cmd+Q and reboots.</text>

    <!-- Mini command pill -->
    <rect x="0" y="168" width="548" height="38" rx="9" fill="#0B0F18" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="192" fill="#64748B" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13">$</text>
    <text x="32" y="192" fill="#E2E8F0" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13">./enable-chrome-gemini.sh</text>
    <text x="242" y="192" fill="#475569" font-family="'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12">|  --dry-run  ·  --disable  ·  --reset</text>
  </g>

  <!-- Right column: Clean architecture card -->
  <g transform="translate(835, 58)">
    <rect x="0" y="0" width="305" height="204" rx="14" fill="#0D121D" fill-opacity="0.88" stroke="#1F2A40" stroke-width="1.2"/>
    <text x="20" y="30" fill="#64748B" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.08em">LAUNCH FLOW</text>

    <!-- Box 1 -->
    <rect x="20" y="46" width="265" height="44" rx="8" fill="#131B2B" stroke="#273552" stroke-width="1"/>
    <text x="34" y="65" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">/Applications/Google Chrome.app</text>
    <text x="34" y="81" fill="#7DD3FC" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">wrapper · passes Glic + US flags</text>

    <!-- Connector arrow -->
    <line x1="152" y1="90" x2="152" y2="118" stroke="#475569" stroke-width="1.5"/>
    <path d="M147 113 L152 119 L157 113" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Box 2 -->
    <rect x="20" y="122" width="265" height="62" rx="8" fill="#131B2B" stroke="#273552" stroke-width="1"/>
    <text x="34" y="143" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">.Google Chrome Original.app</text>
    <text x="34" y="160" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5">--enable-features=Glic,GlicSidePanel</text>
    <text x="34" y="175" fill="#94A3B8" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5">--variations-override-country=us</text>
  </g>
</svg>
